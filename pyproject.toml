[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawd-codex"
version = "0.4.8"
description = "Jonathan Ai — local desktop and CLI agent (Python Claude Code-style runtime)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [
    {name = "Clawd Codex Team", email = "team@example.com"}
]
keywords = ["claude", "cli", "ai", "llm", "anthropic", "openai", "glm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "anthropic",
    "openai",
    "zhipuai",
    "huggingface_hub>=0.24.0",
    "python-dotenv",
    "rich",
    "prompt-toolkit",
    "tiktoken>=0.7.0",
    "Pillow>=10.4.0",
    "opencv-python-headless>=4.10.0",
    "rapidocr-onnxruntime>=1.4.4",
    "trimesh>=4.4.0",
    "psutil>=6.0.0",
    "yfinance>=0.2.54",
    "pandas>=2.2.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pyautogui>=0.9.54",
    "uv>=0.5.0",
    "torch>=2.4.0",
    "diffusers>=0.35.0",
    "accelerate>=1.0.0",
    "transformers>=4.48.0",
    "safetensors>=0.5.0",
    "faster-whisper>=1.1.0",
    "feedparser>=6.0.11",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=5.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
clawd = "src.cli:main"
clawd-desktop = "src.desktop.__main__:main"
clawd-install = "src.install.__main__:main"
jonathan-ai = "src.cli:main"
jonathan-ai-desktop = "src.desktop.__main__:main"
jonathan-ai-install = "src.install.__main__:main"

[project.urls]
Homepage = "https://github.com/GoDeskio/Clawd-Code"
Repository = "https://github.com/GoDeskio/Clawd-Code"
Documentation = "https://github.com/GoDeskio/Clawd-Code#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.skills" = ["bundled/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["integrations", ".venv", "node_modules", ".git"]
