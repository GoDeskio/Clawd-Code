[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawd-codex"
version = "0.2.3"
description = "Jonathan Ai — local desktop and CLI agent (Python Claude Code-style runtime)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Clawd Codex Team", email = "team@example.com"}
]
keywords = ["claude", "cli", "ai", "llm", "anthropic", "openai", "glm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "anthropic",
    "openai",
    "zhipuai",
    "huggingface_hub>=0.24.0",
    "python-dotenv",
    "rich",
    "prompt-toolkit",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=5.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
clawd = "src.cli:main"
clawd-desktop = "src.desktop.__main__:main"
clawd-install = "src.install.__main__:main"
jonathan-ai = "src.cli:main"
jonathan-ai-desktop = "src.desktop.__main__:main"
jonathan-ai-install = "src.install.__main__:main"

[project.urls]
Homepage = "https://github.com/GPT-AGI/Clawd-Codex"
Repository = "https://github.com/GPT-AGI/Clawd-Codex"
Documentation = "https://github.com/GPT-AGI/Clawd-Codex#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
